<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TRADE HUB PRO</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .glow-effect {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden px-4">
    <!-- Decorative Ambient Glows -->
    <div class="glow-effect -top-20 -left-20"></div>
    <div class="glow-effect -bottom-20 -right-20" style="background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(0, 0, 0, 0) 70%);"></div>

    <div class="w-full max-w-md glass-card rounded-2xl p-8 relative z-10">
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 mb-3 shadow-lg shadow-blue-500/20">
                <span class="material-symbols-outlined text-3xl text-white">candlestick_chart</span>
            </div>
            <h1 class="text-2xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                TRADE HUB PRO
            </h1>
            <p class="text-sm text-slate-400 mt-1">Option Spread & Algorithmic Trading Suite</p>
        </div>

        <!-- Alert Message Container -->
        <div id="alert-box" class="hidden mb-6 p-4 rounded-xl text-sm border"></div>

        <!-- Login Form -->
        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label for="username" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                    Username / Client ID
                </label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-3 text-slate-400 text-xl">person</span>
                    <input type="text" id="username" required autocomplete="username"
                        class="w-full pl-10 pr-4 py-3 bg-slate-900/80 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all"
                        placeholder="Enter your username">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                    Password
                </label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-3 text-slate-400 text-xl">lock</span>
                    <input type="password" id="password" required autocomplete="current-password"
                        class="w-full pl-10 pr-4 py-3 bg-slate-900/80 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all"
                        placeholder="••••••••••••">
                </div>
            </div>

            <button type="submit" id="btn-submit"
                class="w-full py-3.5 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold rounded-xl text-sm shadow-lg shadow-blue-600/30 hover:shadow-blue-600/50 transition-all duration-200 flex items-center justify-center space-x-2">
                <span>Sign In to Terminal</span>
                <span class="material-symbols-outlined text-lg">arrow_forward</span>
            </button>
        </form>

        <div class="mt-8 text-center text-xs text-slate-500 border-t border-slate-800/80 pt-4">
            Protected & Authorized Access Only • NHtrade.in
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alert-box');
            const submitBtn = document.getElementById('btn-submit');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            alertBox.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Authenticating...</span>
            `;

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok && data.status === 'success') {
                    alertBox.className = 'mb-6 p-4 rounded-xl text-sm border bg-emerald-500/10 border-emerald-500/30 text-emerald-400';
                    alertBox.textContent = 'Login successful! Redirecting...';
                    alertBox.classList.remove('hidden');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 500);
                } else {
                    alertBox.className = 'mb-6 p-4 rounded-xl text-sm border bg-rose-500/10 border-rose-500/30 text-rose-400';
                    alertBox.textContent = data.message || 'Invalid username or password.';
                    alertBox.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<span>Sign In to Terminal</span><span class="material-symbols-outlined text-lg">arrow_forward</span>`;
                }
            } catch (err) {
                alertBox.className = 'mb-6 p-4 rounded-xl text-sm border bg-rose-500/10 border-rose-500/30 text-rose-400';
                alertBox.textContent = 'Network error. Please try again.';
                alertBox.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Sign In to Terminal</span><span class="material-symbols-outlined text-lg">arrow_forward</span>`;
            }
        }
    </script>
</body>
</html>
